<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MP3 Merger</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>MP3 Merger</h1>
    
    <div class="upload-section">
      <label for="audioFiles" class="upload-label">
        <svg viewBox="0 0 24 24" width="48" height="48">
          <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z" fill="currentColor"/>
        </svg>
        <span>Select MP3 Files</span>
      </label>
      <input type="file" id="audioFiles" multiple accept=".mp3" class="file-input">
    </div>

    <div id="fileList" class="file-list"></div>

    <button id="mergeButton" class="merge-button" disabled>
      Merge Files
    </button>

    <div id="progress" class="progress-bar" style="display: none;">
      <div class="progress-fill"></div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.0/lame.min.js"></script>
  <script src="app.js"></script>

</html>
